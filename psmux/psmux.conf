# Basic Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

# Let `exit` close panes. psmux doesn't support `remain-on-exit failed`, so
# "on" keeps every pane after its shell exits, not just crashed ones.
set -g remain-on-exit off
# set -s extended-keys on

unbind C-.
unbind C-,

# Set Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Respawn a dead pane with prefix + r
bind r respawn-pane -k -c "#{pane_current_path}"

# psmux's kill-pane silently no-ops on a window's last pane, so kill the window instead
bind x if-shell -F '#{==:#{window_panes},1}' \
  'confirm-before -p "kill-window #W? (y/n)" kill-window' \
  'confirm-before -p "kill-pane #P? (y/n)" kill-pane'

# Plugins
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-vim-navigator'

# Colorscheme
set -g @plugin 'psmux-plugins/psmux-theme-gruvbox'
set -g @gruvbox-variant 'dark'
set -g @gruvbox-contrast 'medium'
set -g @gruvbox-show-powerline 'on'

# Set Vi mode
set-window-option -g mode-keys vi

# Keybinds for vim mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'

# Initialize PPM (keep this line at the very bottom of .psmux.conf)
run '~/.psmux/plugins/ppm/ppm.ps1'

# Reload config (after PPM, since psmux-sensible rebinds R to ~/.psmux.conf)
bind R source-file ~/.config/psmux/psmux.conf \; display-message "Configuration reloaded"
