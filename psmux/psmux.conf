# Basic Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

# Keep panes alive when the shell crashes (e.g. opencode exit / conhost crash)
set -g remain-on-exit on
set -g remain-on-exit-format "Pane died (status #{pane_dead_status}) - prefix + r to respawn"
# set -s extended-keys on

unbind C-.
unbind C-,

# Set Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Respawn a dead pane with prefix + r
bind r respawn-pane -k -c "#{pane_current_path}"

# Reload Tmux
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"

# Plugins
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-vim-navigator'

# Colorscheme
set -g @plugin 'psmux-plugins/psmux-theme-gruvbox'
set -g @gruvbox-variant 'dark'
set -g @gruvbox-contrast 'medium'
set -g @gruvbox-show-powerline 'on'

# Continuum
set -g @continuum-restore 'on'

# Set Vi mode
set-window-option -g mode-keys vi

# Keybinds for vim mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'

# Initialize PPM (keep this line at the very bottom of .psmux.conf)
run '~/.psmux/plugins/ppm/ppm.ps1'
